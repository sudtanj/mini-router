# mini-router, from the published image
#
#   cp .env.example .env     # provider keys + your own MINI_ROUTER_API_KEYS
#   docker compose -f docker-compose.hub.yml up -d
#
# Then point any OpenAI client at http://localhost:8080/v1 and any Anthropic
# client at http://localhost:8080, and ask for the model "fast".
#
# Nothing is built and nothing is mounted: the image is multi-arch
# (linux/amd64 + linux/arm64, so it runs on an Orange Pi Zero 3 unchanged)
# and mini-router is configured entirely from the environment below.
#
# Use docker-compose.yml instead if you want to build from this checkout.

services:
  mini-router:
    # Built from https://github.com/sudtanj/docker-images-generic-builder
    # Pin a version instead of :latest for reproducible pulls --
    # https://hub.docker.com/r/sudtanj/mini-router/tags
    image: sudtanj/mini-router:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"

    environment:
      # --- Providers ---------------------------------------------------------
      # A key on its own is enough: mini-router knows these providers' URLs and
      # which dialect each one speaks. Leave out the ones you do not have.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # Anything else, or to point a well-known provider somewhere else:
      # MINI_ROUTER_PROVIDER_LOCAL_URL: http://ollama:11434/v1
      # MINI_ROUTER_PROVIDER_LOCAL_MAX_CONCURRENCY: "1"

      # --- Pools -------------------------------------------------------------
      # One client-facing name over several provider models, in priority order.
      # The first one serves; anything that fails spills to the next, across
      # providers and across dialects.
      MINI_ROUTER_POOL_FAST: openai:gpt-4o-mini,anthropic:claude-haiku-4-5
      MINI_ROUTER_POOL_SMART: anthropic:claude-sonnet-4-5,openai:gpt-4o

      # Apps with a hard-coded model name can still reach a pool.
      MINI_ROUTER_ALIASES: gpt-3.5-turbo=fast,gpt-4o-mini=fast

      # --- Access ------------------------------------------------------------
      # Turn this on if anything but you can reach the port: these keys are what
      # stand between a stray device and your provider bills.
      MINI_ROUTER_REQUIRE_AUTH: "true"
      MINI_ROUTER_API_KEYS: ${MINI_ROUTER_API_KEYS:?set MINI_ROUTER_API_KEYS in .env}

      # --- Trimming ----------------------------------------------------------
      # Both are JSON/text endpoints, not a dashboard -- mini-router has no web
      # UI at all -- but you can switch them off. /healthz and /readyz stay.
      # MINI_ROUTER_ADMIN: "false"
      # MINI_ROUTER_METRICS: "false"

      MINI_ROUTER_LOG: info

    # Measured on arm64 at 2 GB / 4 CPUs -- an Orange Pi Zero 3's shape -- in
    # mini-router's own CI: 3.2 MB idle, 4.3 MB under 16 concurrent streams.
    # This limit is a fuse, not a fit.
    deploy:
      resources:
        limits:
          memory: 64M

    # Nothing is written to disk, so the filesystem can be read-only.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # No healthcheck override on purpose. The image already declares one that
    # runs `mini-router --healthcheck`, which probes /healthz over a socket
    # from inside the binary -- so the image carries no curl or wget, and an
    # override here that reached for either would fail.

  # A local model server, if you want one behind the same endpoint. It is just
  # another OpenAI-compatible provider as far as mini-router is concerned.
  # ollama:
  #   image: ollama/ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama:/root/.ollama

# volumes:
#   ollama:
